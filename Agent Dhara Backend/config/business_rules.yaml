# Agent Dhara — Business Rules Registry
# Define per-dataset constraints that override ETL plan suggestions.
# These are loaded by etl_graph_nodes.node_capture_business_rules()
#
# Format:
#   <dataset_name>:
#     columns:
#       <column_name>:
#         never_drop: true/false       # never drop this column or its rows
#         required: true/false         # must be non-null always
#         allowed_values: [...]        # whitelist of valid values
#         min_value: <number>          # numeric floor
#         max_value: <number>          # numeric ceiling
#         pattern: "<regex>"           # must match this pattern
#     global:
#       never_drop_rows: true/false    # never drop any rows from this dataset
#       primary_key: <column_name>     # enforced PK — dedup on this column

# Example — uncomment and customize for your datasets:
#
# customers:
#   columns:
#     customer_id:
#       never_drop: true
#       required: true
#     status:
#       allowed_values: ["ACTIVE", "INACTIVE", "PENDING"]
#     age:
#       min_value: 0
#       max_value: 120
#   global:
#     never_drop_rows: false
#     primary_key: customer_id
#
# orders:
#   columns:
#     order_id:
#       never_drop: true
#       required: true
#     revenue:
#       min_value: 0
#   global:
#     never_drop_rows: true
#     primary_key: order_id

