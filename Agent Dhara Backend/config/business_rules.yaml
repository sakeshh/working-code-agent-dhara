# =============================================================================
# Agent Dhara — Business Rules Configuration
# =============================================================================
# This file defines dataset-level and global constraints that override
# the ETL planner's automatic decisions.
#
# Structure:
#   global:           — rules that apply to ALL datasets
#   datasets:         — rules scoped to a specific dataset (by name)
#
# Supported rule keys (per dataset):
#   never_drop_columns: [list]   — these columns must NEVER be drop_nulls'd
#   required_columns:   [list]   — these columns must be present in the output
#   no_auto_fill:       [list]   — do not auto-fill nulls for these columns
#   max_null_pct:       0.0-1.0  — abort ETL if null% exceeds this threshold
#   dedup_key:          [list]   — columns to use for deduplication (overrides auto)
#   target_table:       string   — destination SQL table name (sql engine only)
#   date_format:        string   — strftime format for all date columns
#
# Supported rule keys (global):
#   encoding:         string     — default encoding for file writes (default: utf-8)
#   null_fill_strategy: string   — 'mode' | 'mean' | 'drop' (default: mode)
#   dedup_strategy:   string     — 'keep_first' | 'keep_last' | 'flag' (default: keep_first)
# =============================================================================

global:
  encoding: utf-8
  null_fill_strategy: mode       # mode | mean | drop
  dedup_strategy: keep_first     # keep_first | keep_last | flag
  date_format: "%Y-%m-%d"

# ---------------------------------------------------------------------------
# Dataset-specific rules
# Add your dataset names below and configure per-dataset constraints.
#
# Example:
# datasets:
#   customers:
#     never_drop_columns:
#       - customer_id
#       - email
#     required_columns:
#       - customer_id
#       - name
#     no_auto_fill:
#       - customer_id
#     max_null_pct: 0.30
#     dedup_key:
#       - customer_id
#
#   orders:
#     never_drop_columns:
#       - order_id
#       - customer_id
#     required_columns:
#       - order_id
#       - order_date
#       - amount
#     max_null_pct: 0.10
#     dedup_key:
#       - order_id
#     target_table: dbo.orders_cleaned
# ---------------------------------------------------------------------------

datasets: {}
  # Add your dataset rules here following the example above.
  # Dataset names must match exactly what appears in your assessment report.
